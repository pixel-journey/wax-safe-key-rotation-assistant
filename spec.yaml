blueprint:
  id: wax-safe-key-rotation-assistant
  name: Safe Key Rotation Assistant
  tier: 1
  category: security-foundational
  status: alpha-ready
  version: 0.2

metadata:
  description: |
    A guided, ultra-safe key rotation wizard for changing owner and active keys
    on WAX/Antelope accounts. Crystal-clear previews, powerful safety warnings,
    explicit owner/active asymmetry handling, multi-sig requirement checking,
    and direct WharfKit signing — all client-side.
  target_audience:
    - Human developers and users performing key rotations
    - AI agents generating safe key management flows
    - Teams prioritizing long-term account safety on WAX/Antelope
  related_blueprints:
    - wax-permission-visualizer-and-editor
    - wax-multi-sig-proposal-builder-and-simulator
    - wax-secure-key-management-and-privacy-tools

features:
  - guided_stepper_wizard
  - live_before_after_permission_preview
  - contextual_safety_warnings
  - multi_sig_requirement_checker
  - owner_active_asymmetry_enforcement
  - wharfkit_direct_signing
  - multiple_integration_levels

integration_levels:
  minimal:
    description: Basic key input form + simple warnings
    recommended_for: Learning and simple rotations
  recommended:
    description: Full guided wizard + live preview + strong safety checks + WharfKit
    recommended_for: Most production and user-facing tools
  advanced:
    description: Advanced simulation, multi-sig handling, recovery planning tools
    recommended_for: High-security or complex account management

machine_instructions:
  - |
    Create multi-step wizard with live permission preview using PermissionTree patterns.
  - |
    Implement strong contextual safety warnings and validation rules (12+ rules).
  - |
    Add multi-sig requirement display and strict owner/active asymmetry enforcement.
  - |
    Integrate optional WharfKit signing with clear transaction summary.
  - |
    Support multiple integration levels with progressive safety depth.
  - |
    Prioritize clarity, safety, and calm communication in all flows.

technical_requirements:
  framework: Next.js 15 + TypeScript (strict)
  styling: Tailwind + shadcn/ui + framer-motion
  visualization: Embedded PermissionTree + diff views
  safety: Pure client-side JavaScript validator
  signing: WharfKit (optional)
  design_system: pixel-journey-design-system

best_practices:
  - Always show clear previews before any key change
  - Use strong, contextual warnings (not just generic alerts)
  - Explicitly enforce owner/active asymmetry rules
  - Check multi-sig requirements before allowing rotation
  - Provide calm, actionable guidance throughout
  - Support both simple and advanced use cases

future_extensions:
  - Advanced recovery planning tools
  - Hardware wallet integration patterns
  - Social recovery mechanisms
  - Batch key management for multiple accounts
