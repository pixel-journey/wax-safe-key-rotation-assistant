blueprint:
  id: wax-safe-key-rotation-assistant
  tier: 1
  category: security-foundational
  status: alpha-ready
  benchmark_target: gkniftyheads-tracker + PX
  companion: wax-permission-visualizer-and-editor

features:
  - guided_5_step_wizard
  - live_before_after_permission_preview
  - contextual_safety_warnings (12+ rules)
  - multi_sig_requirement_checker
  - owner_active_asymmetry_enforcement
  - optional_wharfkit_signing
  - retro_pixel_glassmorphic_crt_theme
  - educational_step_by_step_flow

recommended_stack:
  framework: Next.js 15 App Router
  language: TypeScript strict
  preview: embedded PermissionTree (from companion)
  safety: pure_client_js + 12+ rule engine
  state: zustand + url_params
  signing: wharfkit_session (optional)

integration_points:
  - PxWallet: direct key rotation flow from account view
  - Permission Visualizer: seamless handoff (visualize → rotate)
  - Multi-sig tools: requirement checking for complex DAOs
  - entropy: ready for future weighted key generation simulations

machine_instructions_for_ai_devs:
  - "Create 5-step guided wizard with live side-by-side permission preview"
  - "Implement 12+ safety validation rules including owner/active asymmetry"
  - "Add multi-sig requirement display and clear signing instructions"
  - "Reuse PermissionTree visual component from companion repo"
  - "Add strong contextual warnings with risk levels (safe/warning/danger)"

pros_cons_variations:
  wizard_style:
    - option: "multi_step_with_live_preview"
      pros: ["educational", "clear mental model", "high safety"]
      cons: ["more steps than power users want"]
    - option: "single long form"
      pros: ["faster for experts"]
      cons: ["less guidance", "higher error rate for new users"]

security_critical_rules:
  - owner_can_change_active
  - active_cannot_change_owner
  - multi_sig_threshold_must_be_met_by_current_permission
  - last_owner_key_removal_is_dangerous
  - threshold_must_remain_satisfiable_after_change
